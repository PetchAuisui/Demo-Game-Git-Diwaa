name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GODOT_VERSION: 4.7.2
  GODOT_PROJECT: game

jobs:
  # ---------------------------------------------------------------------------
  # Real-git engine (GDScript): import the project, run the integration tests
  # and a CLI smoke test. No UI / rendering needed.
  # ---------------------------------------------------------------------------
  engine:
    name: Engine tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: false

      - name: Show tool versions
        run: |
          godot --version
          git --version

      - name: Import project (builds the script class cache)
        run: |
          godot --headless --path ${{ env.GODOT_PROJECT }} --import --quit
          godot --headless --path ${{ env.GODOT_PROJECT }} --import --quit

      - name: Run real-git tests
        run: |
          godot --headless --path ${{ env.GODOT_PROJECT }} \
            --script "$GITHUB_WORKSPACE/tests/engine/run_tests.gd" 2>&1 | tee tests.log
          test "${PIPESTATUS[0]}" -eq 0
          if grep -qE "SCRIPT ERROR|Parse Error|^FAIL" tests.log; then
            echo "::error::Engine tests reported errors"; exit 1
          fi

      - name: CLI smoke test
        shell: bash
        run: |
          printf 'git --version\ngit config --global user.name "CI"\ngit config --global user.email ci@git-diwaa.local\ngit init\nwrite README.md Hello\ngit add README.md\ngit commit -m "ci smoke"\nsnapshot\nexit\n' \
            | godot --headless --path ${{ env.GODOT_PROJECT }} --script res://engine/cli/cli_main.gd | tee cli.txt
          grep -q '"Subject": "ci smoke"' cli.txt

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: engine-logs-${{ matrix.os }}
          path: |
            tests.log
            cli.txt

  # ---------------------------------------------------------------------------
  # Godot: import assets, load every script/scene/resource headless, run the
  # main scene for a few frames
  # ---------------------------------------------------------------------------
  godot:
    name: Godot scene check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: false

      - name: Godot version
        run: godot --version

      - name: Import assets headless
        run: |
          godot --headless --path ${{ env.GODOT_PROJECT }} --import --quit
          godot --headless --path ${{ env.GODOT_PROJECT }} --import --quit

      - name: Load & instantiate every script/scene/resource
        run: |
          godot --headless --path ${{ env.GODOT_PROJECT }} \
            --script "$GITHUB_WORKSPACE/.github/scripts/check_scenes.gd" 2>&1 | tee scenes.log
          test "${PIPESTATUS[0]}" -eq 0
          if grep -qE "SCRIPT ERROR|Parse Error|Failed loading resource" scenes.log; then
            echo "::error::Godot reported script/resource errors"; exit 1
          fi

      - name: Smoke-run main scene for a few frames
        run: |
          timeout 120 godot --headless --path ${{ env.GODOT_PROJECT }} --quit-after 120 2>&1 | tee run.log
          if grep -qE "SCRIPT ERROR|Parse Error" run.log; then
            echo "::error::Main scene raised errors at startup"; exit 1
          fi

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: godot-logs
          path: |
            scenes.log
            run.log

  ci-success:
    name: CI success
    if: always()
    needs: [engine, godot]
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "engine=${{ needs.engine.result }} godot=${{ needs.godot.result }}"
          test "${{ needs.engine.result }}" = "success" && test "${{ needs.godot.result }}" = "success"

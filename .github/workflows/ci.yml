name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # ต้องเป็น Godot รุ่นมาตรฐาน (ไม่ใช่ .NET/Mono) และ major.minor ต้องตรงกับ config/features ใน project.godot
  GODOT_VERSION: 4.7.2
  GODOT_PROJECT: game
  # account server (ASP.NET Core) อยู่ใน server/ ต้องตรงกับ TargetFramework ใน server/Directory.Build.props
  DOTNET_VERSION: 10.0.x
  SERVER_DIR: server
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  # ---------------------------------------------------------------------------
  # Hygiene: ตรวจโครงสร้างโปรเจกต์โดยไม่ต้องใช้ Godot / .NET
  #  - เกม (ทุกอย่างนอก server/) ไม่มีไฟล์ C# / .NET หลงเหลือ
  #  - ไม่มี build output (bin/ obj/) หรือแคชของ Godot (.godot/ .mono/) ถูก commit ที่ไหนเลย
  #  - project.godot ไม่มีหัวข้อ [dotnet] (Godot รุ่น mono ชอบเติมกลับมาเอง)
  #  - ทุก .gd ใน game/ มี .uid คู่กัน (Godot 4.4+ ใช้ .uid ผูก reference ของสคริปต์)
  #  - Godot ใน CI ตรงกับเวอร์ชันที่ project.godot ระบุ
  # ---------------------------------------------------------------------------
  hygiene:
    name: Project hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # server/ เป็นโปรเจกต์ C# จึงยกเว้น ส่วนเกมต้องเป็น GDScript ล้วน
      - name: No C# / .NET files in the game (outside server/)
        run: |
          bad=$(git ls-files | grep -E '\.(cs|csproj|sln|slnx)$' | grep -vE "^${SERVER_DIR}/" || true)
          if [ -n "$bad" ]; then
            echo "$bad"
            echo "::error::พบไฟล์ C#/.NET นอกโฟลเดอร์ ${SERVER_DIR}/ (ตัวเกมใช้ GDScript ล้วน โค้ด C# ต้องอยู่ใน ${SERVER_DIR}/ เท่านั้น)"
            exit 1
          fi

      - name: No build output or editor cache committed
        run: |
          bad=$(git ls-files | grep -E '(^|/)\.godot/|(^|/)\.mono/|(^|/)(bin|obj)/|(^|/)TestResults/' || true)
          if [ -n "$bad" ]; then
            echo "$bad"
            echo "::error::พบ build output (bin/ obj/) หรือแคชของ Godot ที่ไม่ควรอยู่ใน repository"
            exit 1
          fi

      - name: project.godot has no [dotnet] section
        run: |
          if grep -n '^\[dotnet\]' "$GODOT_PROJECT/project.godot"; then
            echo "::error file=$GODOT_PROJECT/project.godot::มีหัวข้อ [dotnet] (มักเกิดจากเปิดด้วย Godot รุ่น mono) ให้ git restore $GODOT_PROJECT/project.godot หรือลบหัวข้อนี้ก่อน commit"
            exit 1
          fi

      # ตรวจเฉพาะใน game/ เพราะ Godot สร้าง .uid ให้เฉพาะสคริปต์ที่อยู่ใน project
      # (.github/scripts และ tests/ รันด้วย --script จึงไม่มี .uid)
      - name: Every GDScript file in the Godot project has a .uid file
        run: |
          missing=0
          while IFS= read -r f; do
            if ! git ls-files --error-unmatch "$f.uid" >/dev/null 2>&1; then
              echo "::error file=$f::ไม่มี $f.uid ที่ commit คู่กัน (เปิดโปรเจกต์ใน Godot editor แล้ว commit ไฟล์ .uid ด้วย)"
              missing=1
            fi
          done < <(git ls-files "$GODOT_PROJECT/*.gd")
          exit $missing

      - name: No orphan .uid files in the Godot project
        run: |
          orphan=0
          while IFS= read -r u; do
            if [ ! -f "${u%.uid}" ]; then
              echo "::error file=$u::ไฟล์ .uid ไม่มีสคริปต์คู่กัน (ลบ .uid ที่ค้างอยู่)"
              orphan=1
            fi
          done < <(git ls-files "$GODOT_PROJECT/*.gd.uid")
          exit $orphan

      - name: Godot version matches project.godot
        run: |
          expected="${GODOT_VERSION%.*}"
          actual=$(sed -n 's/^config\/features=PackedStringArray("\([0-9]*\.[0-9]*\)".*/\1/p' "$GODOT_PROJECT/project.godot")
          echo "CI Godot: $GODOT_VERSION | project.godot features: $actual"
          if [ "$expected" != "$actual" ]; then
            echo "::error file=$GODOT_PROJECT/project.godot::config/features ($actual) ไม่ตรงกับ GODOT_VERSION ($GODOT_VERSION) ใน ci.yml"
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # Real-git engine (GDScript): import project, run integration tests with a
  # real Git, then a CLI smoke test. Headless – no UI / rendering needed.
  # ---------------------------------------------------------------------------
  engine:
    name: Engine tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: false

      - name: Show tool versions
        run: |
          godot --version
          git --version

      # import รอบแรกสร้างแคชของ asset/class_name ส่วนรอบสองให้ global_script_class_cache
      # ครบ (สคริปต์ที่อ้าง class_name ข้ามกันจะ parse ผ่านในรอบหลัง)
      - name: Import project (builds the script class cache)
        run: |
          godot --headless --path "$GODOT_PROJECT" --import --quit
          godot --headless --path "$GODOT_PROJECT" --import --quit

      - name: Run real-git integration tests
        run: |
          set -o pipefail
          godot --headless --path "$GODOT_PROJECT" \
            --script "$GITHUB_WORKSPACE/tests/engine/run_tests.gd" 2>&1 | tee tests.log
          if grep -qE "SCRIPT ERROR|Parse Error|Failed loading resource|^FAIL" tests.log; then
            echo "::error::Engine tests reported errors"; exit 1
          fi
          grep -qE "^[0-9]+/[0-9]+ real-Git integration tests passed" tests.log

      - name: CLI smoke test
        run: |
          set -o pipefail
          printf '%s\n' \
            'git --version' \
            'git config --global user.name "CI"' \
            'git config --global user.email ci@git-diwaa.local' \
            'git init' \
            'write README.md Hello' \
            'git add README.md' \
            'git commit -m "ci smoke"' \
            'snapshot' \
            'exit' \
            | godot --headless --path "$GODOT_PROJECT" --script res://engine/cli/cli_main.gd 2>&1 | tee cli.txt
          if grep -qE "SCRIPT ERROR|Parse Error|Failed loading resource" cli.txt; then
            echo "::error::CLI raised script errors"; exit 1
          fi
          grep -q '"Subject": "ci smoke"' cli.txt

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: engine-logs-${{ matrix.os }}
          path: |
            tests.log
            cli.txt
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Godot: import assets, load every script/scene/resource headless (catches
  # GDScript parse errors and broken scene references), run the main scene for
  # a few frames
  # ---------------------------------------------------------------------------
  godot:
    name: Godot scene check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: false

      - name: Godot version
        run: godot --version

      - name: Import assets headless
        run: |
          godot --headless --path "$GODOT_PROJECT" --import --quit
          godot --headless --path "$GODOT_PROJECT" --import --quit

      - name: Load & instantiate every script/scene/resource
        run: |
          set -o pipefail
          godot --headless --path "$GODOT_PROJECT" \
            --script "$GITHUB_WORKSPACE/.github/scripts/check_scenes.gd" 2>&1 | tee scenes.log
          if grep -qE "SCRIPT ERROR|Parse Error|Failed loading resource|^FAIL" scenes.log; then
            echo "::error::Godot reported script/resource errors"; exit 1
          fi
          # UID ใน .tscn/.tres ที่ชี้ไปหา resource ไม่เจอ: ยังโหลดได้ด้วย path จึงเตือนอย่างเดียว ไม่ทำให้ CI ล้ม
          grep -E "invalid UID" scenes.log | sort -u | while IFS= read -r line; do
            echo "::warning::${line}"
          done || true

      - name: Smoke-run main scene for a few frames
        run: |
          set -o pipefail
          timeout 120 godot --headless --path "$GODOT_PROJECT" --quit-after 120 2>&1 | tee run.log
          if grep -qE "SCRIPT ERROR|Parse Error|Failed loading resource" run.log; then
            echo "::error::Main scene raised errors at startup"; exit 1
          fi

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: godot-logs
          path: |
            scenes.log
            run.log
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Account server (server/, ASP.NET Core): restore + build (warning = error
  # ตาม Directory.Build.props) แล้วรันเทสทั้ง 2 ชุด เทสเป็น console runner ที่
  # คืน exit code != 0 เมื่อมีเทสล้ม และ server ในเทสผูกพอร์ต 0 จึงรันขนานได้
  # ถ้า branch ยังไม่มี server/ (เช่น main ก่อน merge feature/auth-login) job นี้จะผ่านโดยข้ามทุกขั้น
  # ---------------------------------------------------------------------------
  server:
    name: Account server (.NET)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: ${{ env.SERVER_DIR }}
    steps:
      - uses: actions/checkout@v4

      - name: Detect server project
        id: detect
        working-directory: .
        run: |
          sln=$(ls "$SERVER_DIR"/*.slnx "$SERVER_DIR"/*.sln 2>/dev/null | head -n1 || true)
          if [ -z "$sln" ]; then
            echo "::notice::ไม่พบ solution ใน $SERVER_DIR/ ข้ามการ build server"
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "solution=$(basename "$sln")" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup .NET
        if: steps.detect.outputs.present == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        if: steps.detect.outputs.present == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('server/**/*.csproj', 'server/Directory.Build.props', 'server/NuGet.Config') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Show tool versions
        if: steps.detect.outputs.present == 'true'
        run: dotnet --info

      - name: Restore
        if: steps.detect.outputs.present == 'true'
        run: dotnet restore "${{ steps.detect.outputs.solution }}"

      - name: Build
        if: steps.detect.outputs.present == 'true'
        run: dotnet build "${{ steps.detect.outputs.solution }}" --configuration Release --no-restore

      - name: Test (GitDiwaa.Online.Tests)
        if: steps.detect.outputs.present == 'true'
        run: |
          set -o pipefail
          dotnet run --project tests/GitDiwaa.Online.Tests --configuration Release --no-build 2>&1 | tee ../online-tests.log

      - name: Test (GitDiwaa.Server.Tests)
        if: steps.detect.outputs.present == 'true'
        run: |
          set -o pipefail
          dotnet run --project tests/GitDiwaa.Server.Tests --configuration Release --no-build 2>&1 | tee ../server-tests.log

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-logs
          path: |
            online-tests.log
            server-tests.log
          if-no-files-found: ignore

  ci-success:
    name: CI success
    if: always()
    needs: [hygiene, engine, godot, server]
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to succeed
        run: |
          echo "hygiene=${{ needs.hygiene.result }} engine=${{ needs.engine.result }} godot=${{ needs.godot.result }} server=${{ needs.server.result }}"
          test "${{ needs.hygiene.result }}" = "success"
          test "${{ needs.engine.result }}" = "success"
          test "${{ needs.godot.result }}" = "success"
          test "${{ needs.server.result }}" = "success"
